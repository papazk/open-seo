name: Review upstream OpenSEO releases

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-release-check
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'papazk/open-seo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check stable release and open a deduplicated review issue
        run: node scripts/check-upstream-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
